spring:
  application:
    name: feature-flags
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flags}
    username: ${DB_USER:flags}
    password: ${DB_PASSWORD:flags}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# One SDK key per environment; a key can only evaluate its own environment. Defaults are for local dev only.
app:
  sdk-keys:
    dev: ${SDK_KEY_DEV:dev-sdk-key}
    prod: ${SDK_KEY_PROD:prod-sdk-key}
