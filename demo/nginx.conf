server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the backend per request (Docker DNS), so this server starts and stays up while the
  # backend is down; /api then fails fast instead of taking the whole page with it.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location /api/ {
    proxy_pass $backend;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Server-sent events: no buffering (events must flush immediately) and a long read timeout;
  # the backend sends a keepalive every 20 s and EventSource reconnects on its own.
  location = /api/evaluate/stream {
    proxy_pass $backend;
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}
