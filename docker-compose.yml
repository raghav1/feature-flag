services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flags
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flags
      DB_USER: flags
      DB_PASSWORD: flags
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build: ./admin
    ports:
      - "5173:80"
    depends_on:
      - backend

  demo:
    build: ./demo
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  pgdata:
