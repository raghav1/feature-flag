services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flags
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    # Localhost only, on 5433 so it doesn't clash with a Postgres already running on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flags
      DB_USER: flags
      DB_PASSWORD: flags
      SDK_KEY_DEV: ${SDK_KEY_DEV:-dev-sdk-key}
      SDK_KEY_PROD: ${SDK_KEY_PROD:-prod-sdk-key}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build: ./admin
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - backend

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
      # Vite bakes these into the bundle, so they must match the backend's keys.
      args:
        VITE_SDK_KEY_DEV: ${SDK_KEY_DEV:-dev-sdk-key}
        VITE_SDK_KEY_PROD: ${SDK_KEY_PROD:-prod-sdk-key}
    ports:
      - "${DEMO_PORT:-5174}:80"
    depends_on:
      - backend

volumes:
  pgdata:
